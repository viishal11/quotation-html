<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folio — Quotations &amp; Invoices</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 3h13l6 6v20H7z' fill='%2316505B'/%3E%3Cpath d='M20 3v6h6' fill='%23D08A1E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar navigation -->
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3h13l6 6v20H7z" fill="#E8EEF0"/><path d="M20 3v6h6z" fill="#D08A1E"/><path d="M11 15h11M11 19h11M11 23h7" stroke="#16505B" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div>
          <div class="brand-name">Folio</div>
          <div class="brand-sub">Quotations &amp; invoices</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn" data-view="dashboard"><i data-icon="dashboard"></i><span>Dashboard</span></button>
        <button class="nav-btn" data-view="quotation"><i data-icon="quote"></i><span>Quotation</span></button>
        <button class="nav-btn" data-view="invoice"><i data-icon="invoice"></i><span>Invoice / Bill</span></button>
        <button class="nav-btn" data-view="saved"><i data-icon="folder"></i><span>Saved</span></button>
        <button class="nav-btn" data-view="settings"><i data-icon="settings"></i><span>Settings</span></button>
      </nav>
      <p class="sidebar-note">Everything is stored in this browser. Export JSON to keep a backup.</p>
    </aside>

    <main class="main">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-saved"></section>
      <section class="view" id="view-settings"></section>

      <!-- Editor + live preview (used for both quotation and invoice) -->
      <section class="view" id="view-editor">
        <header class="toolbar">
          <div class="tb-doc">
            <span class="tb-kind" id="tb-kind">Quotation</span>
            <strong class="tb-number" id="tb-number">—</strong>
            <span class="tb-dirty" id="tb-dirty" hidden>Unsaved changes</span>
          </div>
          <div class="tb-total" id="tb-total"></div>
          <div class="tb-actions">
            <button class="btn" data-action="convert" id="btn-convert"><i data-icon="convert"></i><span class="lbl">Convert to invoice</span></button>
            <button class="btn" data-action="save"><i data-icon="save"></i><span class="lbl">Save draft</span></button>
            <button class="btn" data-action="preview" id="btn-preview"><i data-icon="eye"></i><span class="lbl">Preview</span></button>
            <button class="btn" data-action="print"><i data-icon="printer"></i><span class="lbl">Print</span></button>
            <button class="btn btn-accent" data-action="pdf"><i data-icon="download"></i><span class="lbl">Generate PDF</span></button>
            <div class="menu-wrap">
              <button class="btn btn-icon" data-action="menu" aria-haspopup="true" aria-expanded="false" aria-label="More actions"><i data-icon="more"></i></button>
              <div class="menu" role="menu">
                <button role="menuitem" data-action="new-quote"><i data-icon="plus"></i>New quotation</button>
                <button role="menuitem" data-action="new-invoice"><i data-icon="plus"></i>New invoice</button>
                <hr>
                <button role="menuitem" data-action="export-json"><i data-icon="download"></i>Save as JSON</button>
                <button role="menuitem" data-action="import-json"><i data-icon="upload"></i>Load JSON</button>
                <hr>
                <button role="menuitem" data-action="clear" class="danger"><i data-icon="erase"></i>Clear form</button>
              </div>
            </div>
          </div>
        </header>

        <div class="pane-switch" role="tablist" aria-label="Editor or preview">
          <button role="tab" data-action="pane" data-pane="edit" class="active">Edit</button>
          <button role="tab" data-action="pane" data-pane="preview">Preview</button>
        </div>

        <div class="workspace" id="workspace">
          <div class="editor" id="editor"></div>
          <div class="preview-pane" aria-label="Document preview">
            <div class="preview-bar">
              <span id="page-count">A4</span>
              <label class="tpl-select">Template
                <select data-path="settings.template" id="preview-template">
                  <option value="modern">Modern</option>
                  <option value="corporate">Corporate</option>
                  <option value="minimal">Minimal</option>
                </select>
              </label>
            </div>
            <div class="preview-scroll" id="preview-scroll">
              <div class="scaler" id="scaler"><div id="pages" class="pages"></div></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Overlays and helpers -->
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="pdf-stage" aria-hidden="true"></div>
  <div id="print-root"></div>
  <input type="file" id="img-input" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
  <input type="file" id="json-input" accept="application/json,.json" hidden>

  <!-- PDF libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
